name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나만. 진행 중인 배포는 취소하지 않는다 —
# 중간에 끊으면 Pages가 어중간한 상태로 남는다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # setup-node의 cache: pnpm은 pnpm이 먼저 설치돼 있어야 동작한다 — 순서를 바꾸지 말 것
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # 검사는 하나가 실패해도 끝까지 돌린다 — 고치고 푸시하길 반복하지 않도록
      # 한 번의 실행에서 모든 실패를 보여준다. 실패한 스텝이 있으면 잡은 여전히 실패한다.
      - name: lint
        run: pnpm lint
      - name: format
        if: '!cancelled()'
        run: pnpm format:check
      - name: knip
        if: '!cancelled()'
        run: pnpm knip
      - name: test
        if: '!cancelled()'
        run: pnpm test

      # 빌드보다 먼저 온다: 링크 미리보기(og:image)는 절대 URL이라 배포 주소를 빌드 시점에
      # 알아야 하는데, 그 주소를 아는 건 이 액션의 base_url 출력뿐이다(커스텀 도메인 포함).
      # enablement: 저장소에 Pages가 꺼져 있으면 워크플로가 직접 켠다 —
      # Settings에서 손으로 켜두지 않아도 첫 배포가 성공한다.
      - id: pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      # GitHub Pages 프로젝트 사이트는 /<저장소이름>/ 아래에 놓인다 — 저장소 이름을 직접 받아
      # 절대 경로 base를 만든다. 이름이 바뀌어도 워크플로가 알아서 따라간다.
      # SPA 폴백용 404.html은 빌드가 함께 만든다(vite.config.ts).
      # 퀴즈 성공 알림용 Discord 웹훅. 정적 사이트라 서버가 없어 빌드에 심는다 —
      # 이 값은 배포된 번들에 그대로 들어가니 채널에 글만 쓸 수 있는 웹훅을 쓸 것.
      # 시크릿이 없으면 알림만 조용히 빠지고 퀴즈는 그대로 동작한다.
      - name: build
        run: pnpm build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_SITE_URL: ${{ steps.pages.outputs.base_url }}
          VITE_DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
